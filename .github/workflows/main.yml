name: Build TradeSpark Web App

on:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # স্টেপ ১: কোড ডাউনলোড করো
      - name: Checkout repository
        uses: actions/checkout@v4

      # স্টেপ ২: Node.js ইনস্টল করো
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # স্টেপ ৩: npm dependencies ইনস্টল করো
      - name: Install dependencies
        run: npm ci

      # স্টেপ ৪: প্রোডাকশন বিল্ড করো
      - name: Build production
        run: npm run build

      # স্টেপ ৫: ফাইল আপলোড করো
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TradeSpark-Build
          path: dist/
